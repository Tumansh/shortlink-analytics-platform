services:

  mysql:
    image: mysql:8.4
    container_name: shortlink-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shortlink
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:latest
    container_name: shortlink-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  app:
    build: .
    container_name: shortlink-app
    restart: always
    depends_on:
      - mysql
      - redis

    ports:
      - "8081:8081"

    environment:
      SERVER_PORT: 8081

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shortlink
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      JWT_SECRET: ThisIsMyVerySecretKeyForShortLinkAnalyticsPlatform2026
      JWT_EXPIRATION: 86400000

volumes:
  mysql-data:
  redis-data: